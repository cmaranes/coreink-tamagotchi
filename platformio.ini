; CoreInk Tamagotchi
;   pio run -e coreink -t upload   -> flash the real device
;   pio run -e sim -t exec         -> run the PC simulator (needs MSYS2 + SDL2, see README)
;   pio test -e test               -> run the game-logic unit tests on the PC

[platformio]
default_envs = coreink

[env]
lib_deps =
    m5stack/M5Unified@^0.2.2

[env:coreink]
platform = espressif32
board = m5stack-coreink
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0

; PC simulator: same code, rendered in an SDL window by M5GFX.
; Paths assume MSYS2 in C:/msys64 with mingw-w64-x86_64-SDL2 installed;
; on macOS/Linux replace them with your SDL2 include/lib dirs.
[env:sim]
platform = native
build_type = debug
build_flags =
    -O1 -xc++ -std=c++17
    -DSDL_MAIN_HANDLED
    -DM5GFX_BOARD=board_M5StackCoreInk
    -DM5GFX_SCALE=3
    -DM5GFX_ROTATION=0
    -IC:/msys64/mingw64/include/SDL2
    -LC:/msys64/mingw64/lib
    -lSDL2
build_src_filter = +<*> -<hal/hal_coreink.cpp>

; Unit tests for the pure game logic (no SDL / M5 needed).
[env:test]
platform = native
lib_deps =
test_build_src = yes
build_src_filter = +<game/>
build_flags = -std=c++17
